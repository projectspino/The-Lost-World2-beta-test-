
name: The Lost World 2.0 Build Check

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Check Game Build
    runs-on: ubuntu-latest

    steps:
      - name: Download Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Build Game
        run: npm run build
        
